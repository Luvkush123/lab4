<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country & Capital Selector</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            max-width: 650px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
        }

        .selector-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        label {
            font-weight: 600;
            color: #475569;
            font-size: 16px;
        }

        select {
            padding: 10px 16px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background-color: #ffffff;
            color: #1e293b;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Specific CSS customizing the font of the capital */
        .capital-output {
            color: #2563eb;           /* Custom Color */
            font-weight: bold;         /* Bold */
            font-size: 22px;           /* Custom Font Size */
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .capital-output:empty::before {
            content: "—";
            color: #94a3b8;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Country &amp; Capital Finder</h1>
        
        <div class="selector-container">
            <label for="countrySelect">Select Country:</label>
            <select id="countrySelect" onchange="showCapital()">
                <option value="">-- Choose a Country --</option>
                <option value="New Delhi">India</option>
                <option value="Tokyo">Japan</option>
                <option value="Paris">France</option>
                <option value="Canberra">Australia</option>
                <option value="Ottawa">Canada</option>
            </select>

            <span id="capitalDisplay" class="capital-output"></span>
        </div>
    </div>

    <script>
        function showCapital() {
            const selectElement = document.getElementById("countrySelect");
            const capitalDisplay = document.getElementById("capitalDisplay");
            
            const selectedCapital = selectElement.value;
            capitalDisplay.textContent = selectedCapital;
        }
    </script>

</body>
</html>
